name: Update Profile Contribution Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Diagnose repository contents
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Current directory: $(pwd)"
          echo "Checked-out commit:"
          git log -1 --oneline

          echo "Root files:"
          ls -la

          echo "Scripts directory:"
          ls -la scripts

          echo "Dependency file:"
          if [ -f scripts/requirements.txt ]; then
            cat scripts/requirements.txt
          else
            echo "requirements.txt is missing from the runner workspace."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Validate generated files
        run: |
          test -s data/contributions.json
          test -s contrib-heatmap.svg
          grep -q "<svg" contrib-heatmap.svg
          echo "Heatmap generated successfully."

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
