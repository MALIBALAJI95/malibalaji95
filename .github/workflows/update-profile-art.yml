name: Update Profile Contribution Art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required files
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Repository files:"
          ls -la
          ls -la scripts

          test -f scripts/requirements.txt || {
            echo "ERROR: scripts/requirements.txt is missing from the checked-out commit."
            exit 1
          }

          test -f scripts/fetch_contributions.py
          test -f scripts/render_heatmap_svg.py

          echo "All required files are present."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Validate generated files
        run: |
          test -s data/contributions.json
          test -s contrib-heatmap.svg
          grep -q "<svg" contrib-heatmap.svg
          echo "Contribution heatmap generated successfully."

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
