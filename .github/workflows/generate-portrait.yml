name: Generate Profile Assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: false

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install portrait dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-portrait.txt

      - name: Prepare portrait
        run: python scripts/prep_photo.py

      - name: Generate animated ASCII portrait
        run: python scripts/make_ascii_svg.py

      - name: Generate animated info card
        run: python scripts/make_info_card.py

      - name: Validate generated assets
        run: |
          test -s avi-ascii.svg
          test -s info-card.svg
          grep -q "<svg" avi-ascii.svg
          grep -q "<svg" info-card.svg
          echo "Profile assets generated successfully."

      - name: Remove source photos
        run: |
          rm -f assets/image.png
          rm -f assets/source-photo.jpg
          rm -f assets/source-prepped.png

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update animated profile assets"
          file_pattern: "avi-ascii.svg info-card.svg assets/image.png"
